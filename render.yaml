services:
  - type: web
    name: emotion-music-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: 1
      - key: TF_CPP_MIN_LOG_LEVEL
        value: 2
      - key: DEEPFACE_HOME
        value: /tmp/.deepface
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: APP_DEPLOYMENT_MODE
        value: non_commercial
      - key: JAMENDO_ENABLED
        value: "true"
      - key: AUDIUS_ENABLED
        value: "true"
      - key: MUBERT_ENABLED
        value: "false"
      - key: PRIVACY_POLICY_VERSION
        value: "2026.1"
      - key: TERMS_VERSION
        value: "2026.1"
      - key: CAMERA_CONSENT_VERSION
        value: "2026.1"
      - key: DEFAULT_JURISDICTION
        value: IN
      # Secret / Custom Variables (Add in Render Dashboard)
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: JAMENDO_CLIENT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
