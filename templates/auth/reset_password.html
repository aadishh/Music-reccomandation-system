<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Emotion Music Recommender</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="{{ url_for('index') }}" class="auth-logo">🎵 Emotion Recommender</a>
                <h2>Choose a New Password</h2>
                <p class="text-muted">Enter a strong new password for your account.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="flash-banner flash-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('auth.reset_password') }}" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="password">New Password (minimum 8 characters)</label>
                    <input type="password" id="password" name="password" required minlength="8" placeholder="••••••••" class="form-control" autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-large">Update Password</button>
            </form>

            <div class="auth-footer">
                <p><a href="{{ url_for('auth.login_view') }}" class="auth-link">Return to Sign In</a></p>
            </div>
        </div>
    </div>
</body>
</html>
