<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completing Authentication - Emotion Music Recommender</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-card" style="text-align: center;">
            <div class="spinner" style="margin: 20px auto;"></div>
            <h2>Completing Sign In...</h2>
            <p class="text-muted">Please wait while we verify your session.</p>
        </div>
    </div>

    <script>
        (function() {
            // Check hash fragment for Supabase access_token
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash || window.location.search);
            const accessToken = params.get('access_token');
            const refreshToken = params.get('refresh_token');

            if (accessToken) {
                // Set cookie and session
                document.cookie = `sb_access_token=${accessToken}; path=/; max-age=604800; SameSite=Lax`;
                window.location.href = "{{ url_for('index') }}";
            } else {
                // If no token found, redirect to login
                setTimeout(() => {
                    window.location.href = "{{ url_for('auth.login_view') }}";
                }, 1500);
            }
        })();
    </script>
</body>
</html>
